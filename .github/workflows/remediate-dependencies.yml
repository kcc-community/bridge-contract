name: Validate dependency remediation

on:
  push:
    branches: [chore/dependency-security-20260922]
    paths:
      - .github/workflows/remediate-dependencies.yml
      - .github/scripts/prepare-security-candidate.cjs

permissions:
  contents: read

concurrency:
  group: one-time-dependency-remediation
  cancel-in-progress: false

jobs:
  candidate:
    if: github.actor == 'viaweb3'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Use a current npm with shrinkwrap fixes
        run: npm install --global npm@12.0.2 --ignore-scripts --no-audit --no-fund
      - name: Re-audit the baseline with the same npm version
        run: |
          npm --version
          set +e
          npm audit --include=dev --package-lock-only --ignore-scripts --json > audit-before.json
          status=$?
          set -e
          node -e 'const a=require("./audit-before.json"); if(a.error || !a.metadata) throw new Error(JSON.stringify(a)); console.log("BASELINE_AUDIT", JSON.stringify(a.metadata));'
          if [ "$status" -gt 1 ]; then exit "$status"; fi
      - name: Prepare candidate without changing contract sources
        run: |
          node .github/scripts/prepare-security-candidate.cjs
          npm pkg set 'engines.node=>=22.22.2 <23' 'packageManager=npm@12.0.2'
      - name: Generate lockfile from an actual installation
        run: |
          rm package-lock.json
          npm install --ignore-scripts --no-audit --no-fund > resolution.log 2>&1 || { tail -80 resolution.log; exit 1; }
      - name: Audit every dependency, including development tools
        run: |
          set +e
          npm audit --include=dev --package-lock-only --ignore-scripts --json > audit-candidate.json
          status=$?
          set -e
          node - <<'NODE'
          const fs = require('node:fs');
          const audit = JSON.parse(fs.readFileSync('audit-candidate.json', 'utf8'));
          if (audit.error || !audit.metadata) throw new Error(JSON.stringify(audit.error || audit));
          const counts = audit.metadata.vulnerabilities;
          const baseline = require('./audit-before.json').metadata.vulnerabilities;
          console.log('CANDIDATE_AUDIT', JSON.stringify(audit.metadata));
          for (const [name, value] of Object.entries(audit.vulnerabilities || {})) {
            console.log('REMAINING', JSON.stringify({name, severity:value.severity, direct:value.isDirect, fix:value.fixAvailable}));
          }
          const summary = {npm: '12.0.2', baseline, candidate:counts};
          fs.writeFileSync('security-summary.json', JSON.stringify(summary, null, 2) + '\n');
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, '# Dependency remediation candidate\n\n```json\n' + JSON.stringify(summary,null,2) + '\n```\n\nCounts are npm audit records, not GitHub Dependabot alert counts. Remaining advisories are not dismissed. Contract sources and compiler version are unchanged.\n');
          if (counts.total >= baseline.total || counts.critical >= baseline.critical) throw new Error('Candidate does not improve the baseline');
          NODE
          if [ "$status" -gt 1 ]; then exit "$status"; fi
      - name: Install the exact candidate lockfile from scratch
        run: npm ci --no-audit --no-fund > install.log 2>&1 || { tail -80 install.log; exit 1; }
      - name: Compile all contracts with Solidity 0.7.4
        run: npm run compile 2>&1 | tee compile.log
      - name: Run all existing tests on an ephemeral local chain
        run: npm test 2>&1 | tee test.log
      - name: Check contract sources remained byte-for-byte unchanged
        run: |
          git diff --exit-code -- contracts migrations
          git diff --stat
      - name: Upload validated candidate files
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: validated-dependency-candidate
          include-hidden-files: true
          retention-days: 7
          path: |
            package.json
            package-lock.json
            truffle-config.js
            .nvmrc
            .solcover.js
            test/bridge.logic.test.js
            test/bridge.pair.test.js
            test/bridge.storage.test.js
            test/bridge.test.js
      - name: Upload audit and verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: remediation-evidence
          retention-days: 14
          path: |
            audit-before.json
            audit-candidate.json
            security-summary.json
            source-hashes.json
            resolution.log
            install.log
            compile.log
            test.log

  persist-validated-candidate:
    needs: candidate
    if: github.event_name == 'push' && github.ref == 'refs/heads/chore/dependency-security-20260922' && github.actor == 'viaweb3'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: chore/dependency-security-20260922
      - name: Refuse to overwrite concurrent changes
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/download-artifact@v4
        with:
          name: validated-dependency-candidate
          path: candidate-files
      - name: Commit only the validated dependency and test harness files
        run: |
          for file in package.json package-lock.json truffle-config.js .nvmrc .solcover.js test/bridge.logic.test.js test/bridge.pair.test.js test/bridge.storage.test.js test/bridge.test.js; do
            test -f "candidate-files/$file"
            test ! -L "candidate-files/$file"
            cp "candidate-files/$file" "$file"
            git add -- "$file"
          done
          git diff --cached --stat
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -c core.hooksPath=/dev/null commit -m 'chore: reduce legacy dependency vulnerabilities and restore reproducible tests'
          git push origin HEAD:refs/heads/chore/dependency-security-20260922
