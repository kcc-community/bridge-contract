name: Dependency security and contract tests

on:
  push:
    branches: [main, chore/dependency-security-20260922]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
      - name: Use the package manager that generated the lockfile
        run: npm install --global npm@12.0.2 --ignore-scripts --no-audit --no-fund
      - name: Report all dependency advisories, including development tools
        shell: bash
        run: |
          set +e
          npm audit --include=dev --package-lock-only --ignore-scripts --json > dependency-audit.json
          status=$?
          set -e
          node - <<'NODE'
          const fs = require('node:fs');
          const audit = JSON.parse(fs.readFileSync('dependency-audit.json', 'utf8'));
          if (audit.error || !audit.metadata || !audit.metadata.vulnerabilities) {
            throw new Error('Dependency audit did not complete: ' + JSON.stringify(audit.error || audit));
          }
          const counts = audit.metadata.vulnerabilities;
          console.log(JSON.stringify(audit.metadata, null, 2));
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,
            '# Full dependency audit\n\n```json\n' + JSON.stringify(counts, null, 2) +
            '\n```\n\nThis report is informational while the documented legacy-toolchain findings remain. ' +
            'A passing build is not a clean security audit. See docs/dependency-security.md and the full JSON artifact. ' +
            'Dependabot alerts are not disabled or dismissed.\n');
          if (counts.total > 0) {
            console.log('::warning::Known and/or newly reported dependency vulnerabilities remain. Review the full audit artifact; CI success does not mean vulnerability-free.');
          }
          NODE
          if [ "$status" -gt 1 ]; then exit "$status"; fi
      - name: Clean install from the committed lockfile
        run: npm ci --no-audit --no-fund
      - name: Compile with pinned Solidity 0.7.4
        run: npm run compile
      - name: Run contract tests without deployment credentials or live networks
        run: npm test
      - name: Ensure installation and tests did not change tracked inputs
        run: git diff --exit-code -- package.json package-lock.json contracts migrations
      - name: Save full audit evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: dependency-audit-${{ github.run_id }}
          path: dependency-audit.json
          if-no-files-found: warn
          retention-days: 30
