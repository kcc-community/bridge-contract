name: Dependency security and contract tests

on:
  push:
    branches: [main, chore/dependency-security-20260922]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Use the package manager that generated the lockfile
        run: npm install --global npm@12.0.2 --ignore-scripts --no-audit --no-fund
      - name: Report all advisories and reject fixed-vulnerability regressions
        shell: bash
        run: |
          set +e
          npm audit --include=dev --package-lock-only --ignore-scripts --json > dependency-audit.json
          status=$?
          set -e
          node - <<'NODE'
          const fs = require('node:fs');
          const audit = JSON.parse(fs.readFileSync('dependency-audit.json', 'utf8'));
          if (audit.error || !audit.metadata || !audit.metadata.vulnerabilities) {
            throw new Error('Dependency audit did not complete: ' + JSON.stringify(audit.error || audit));
          }
          const counts = audit.metadata.vulnerabilities;
          const unique = new Map();
          for (const item of Object.values(audit.vulnerabilities || {})) {
            for (const advisory of item.via) {
              if (typeof advisory !== 'string') unique.set(advisory.url, advisory);
            }
          }
          const bySeverity = { critical: 0, high: 0, moderate: 0, low: 0, info: 0 };
          for (const advisory of unique.values()) bySeverity[advisory.severity]++;
          const summary = { vulnerablePackageRecords: counts, uniqueAdvisories: unique.size, uniqueAdvisoriesBySeverity: bySeverity };
          console.log(JSON.stringify(summary, null, 2));
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,
            '# Full dependency audit\n\n```json\n' + JSON.stringify(summary, null, 2) +
            '\n```\n\nAll dependencies, including development tools, are audited. Critical findings and the return of ' +
            'the fixed Request/decoder advisories fail CI. Other findings remain visible and are not automatically accepted. ' +
            'These counts are not GitHub Dependabot alert counts. See docs/dependency-security.md and the full JSON artifact.\n');
          if (counts.total > 0) {
            console.log('::warning::Dependency advisories remain. Passing CI is not a clean security audit; review the complete report.');
          }
          if (counts.critical > 0) throw new Error('Critical dependency vulnerability regression');
          for (const id of ['GHSA-p8p7-x288-28g6', 'GHSA-vcc3-ghjq-m6fr']) {
            if ([...unique.keys()].some(url => url.includes(id))) throw new Error('Fixed advisory returned: ' + id);
          }
          NODE
          if [ "$status" -gt 1 ]; then exit "$status"; fi
      - name: Clean install from the committed lockfile
        run: npm ci --no-audit --no-fund
      - name: Compile with pinned Solidity 0.7.4
        run: npm run compile
      - name: Run contract tests without deployment credentials or live networks
        run: npm test
      - name: Test archive, HTTP and signing compatibility on local fixtures
        run: timeout 180 npm run test:toolchain
      - name: Test patched decoder, redirect and UUID consumers
        run: timeout 60 npm run test:dependency-patches
      - name: Ensure installation and tests did not change tracked inputs
        run: git diff --exit-code -- package.json package-lock.json contracts migrations test scripts tools truffle-config.js
      - name: Save full audit evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: dependency-audit-${{ github.run_id }}
          path: dependency-audit.json
          if-no-files-found: warn
          retention-days: 30
