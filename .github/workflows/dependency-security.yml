name: Dependency security

on:
  push:
    branches: [chore/dependency-security-20260922]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Inspect dependency and compiler baseline
        run: |
          node --version
          npm --version
          git rev-parse HEAD
          cat package.json
          grep -R -nE '(^pragma |^import |require\()' contracts test migrations truffle-config.js
          node - <<'NODE'
          const lock = require('./package-lock.json');
          console.log('Lockfile version:', lock.lockfileVersion);
          for (const name of Object.keys({...require('./package.json').dependencies, ...require('./package.json').devDependencies})) {
            const entry = lock.packages?.['node_modules/' + name] || lock.dependencies?.[name];
            console.log(name, JSON.stringify(entry && {version: entry.version, dependencies: entry.dependencies || entry.requires}));
          }
          NODE
      - name: Audit committed lockfile
        id: audit
        shell: bash
        run: |
          set +e
          npm audit --package-lock-only --ignore-scripts --json > audit-baseline.json
          status=$?
          set -e
          node - <<'NODE'
          const fs = require('node:fs');
          const audit = JSON.parse(fs.readFileSync('audit-baseline.json', 'utf8'));
          if (audit.error || !audit.metadata) throw new Error(JSON.stringify(audit.error || audit));
          console.log(JSON.stringify(audit.metadata, null, 2));
          for (const [name, item] of Object.entries(audit.vulnerabilities || {})) {
            console.log(JSON.stringify({name, severity: item.severity, direct: item.isDirect, range: item.range, fix: item.fixAvailable, via: item.via.map(v => typeof v === 'string' ? v : {title: v.title, url: v.url, range: v.range}), nodes: item.nodes}));
          }
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, '# Committed lockfile audit\n\n```json\n' + JSON.stringify(audit.metadata, null, 2) + '\n```\n\nThis is npm audit data, not a count of GitHub Dependabot alerts. No alerts are dismissed and no contracts are deployed.\n');
          NODE
          if [ "$status" -gt 1 ]; then exit "$status"; fi
      - name: Inspect available toolchain versions
        run: |
          for package in '@truffle/hdwallet-provider' '@openzeppelin/contracts' '@openzeppelin/test-environment' '@openzeppelin/test-helpers' truffle mocha mochawesome prettier prettier-plugin-solidity solhint solidity-coverage table hardhat ethers solc; do
            echo "PACKAGE $package"
            npm view "$package" version deprecated engines --json
          done
      - name: Upload audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-audit-baseline
          path: audit-baseline.json
          if-no-files-found: error
          retention-days: 14
