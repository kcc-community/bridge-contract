name: Validate remaining legacy API fixes

on:
  push:
    branches: [chore/security-tail-20260922]
    paths:
      - .github/workflows/security-tail-candidate.yml
      - .github/scripts/prepare-security-tail.cjs
      - scripts/test-security-compat.cjs

permissions:
  contents: read

concurrency:
  group: security-tail-candidate
  cancel-in-progress: true

jobs:
  candidate:
    if: github.actor == 'viaweb3'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          package-manager-cache: false
      - run: npm install --global npm@12.0.2 --ignore-scripts --no-audit --no-fund
      - name: Record baseline and compiled artifacts
        run: |
          npm audit --include=dev --package-lock-only --ignore-scripts --json > audit-before.json || test "$?" -eq 1
          node -e 'const a=require("./audit-before.json"); if(a.error || !a.metadata) throw new Error(JSON.stringify(a)); console.log(a.metadata);'
          npm ci --no-audit --no-fund > baseline-install.log 2>&1 || { tail -80 baseline-install.log; exit 1; }
          npm run compile > baseline-compile.log 2>&1 || { cat baseline-compile.log; exit 1; }
          cp -R build/contracts .baseline-contracts
      - name: Prepare patched implementations with explicit legacy API adapters
        run: node .github/scripts/prepare-security-tail.cjs
      - name: Generate and clean-install the candidate
        run: |
          rm -rf node_modules
          rm package-lock.json
          npm install --ignore-scripts --no-audit --no-fund > resolution.log 2>&1 || { tail -100 resolution.log; exit 1; }
          rm -rf node_modules
          find tools/compat -type d -name node_modules -prune -exec rm -rf {} +
          npm ci --no-audit --no-fund > install.log 2>&1 || { tail -100 install.log; exit 1; }
      - name: Audit all real packages and reject any new advisory
        run: |
          npm audit --include=dev --package-lock-only --ignore-scripts --json > audit-after.json || test "$?" -eq 1
          node - <<'NODE'
          const fs=require('node:fs'), assert=require('node:assert/strict');
          const before=require('./audit-before.json'), after=require('./audit-after.json');
          if(after.error || !after.metadata) throw new Error(JSON.stringify(after));
          const ids=a=>[...new Set(Object.values(a.vulnerabilities).flatMap(v=>v.via.filter(x=>typeof x==='object').map(x=>x.url)))].sort();
          const previous=ids(before), next=ids(after);
          const introduced=next.filter(id=>!previous.includes(id));
          const removed=previous.filter(id=>!next.includes(id));
          console.log('AUDIT',JSON.stringify({before:before.metadata,after:after.metadata,previous,next,introduced,removed}));
          assert.deepEqual(introduced,[], 'Candidate introduced additional advisories');
          assert.equal(after.metadata.vulnerabilities.critical,0);
          for(const id of ['GHSA-vcc3-ghjq-m6fr','GHSA-w5hq-g745-h8pq','GHSA-p8p7-x288-28g6']) assert.ok(!next.some(url=>url.endsWith(id)),id+' remains');
          fs.writeFileSync('security-tail-summary.json',JSON.stringify({before:before.metadata,after:after.metadata,previous,next,introduced,removed},null,2)+'\n');
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,'# Remaining dependency remediation\n\nDistinct npm advisories: '+previous.length+' → '+next.length+'\n\nNot a verified GitHub Dependabot alert count. Full audit includes development dependencies and adapter backing packages.\n');
          NODE
      - name: Compile and prove this update preserves bytecode
        run: |
          npm run compile > compile.log 2>&1 || { cat compile.log; exit 1; }
          node - <<'NODE'
          const fs=require('node:fs'), assert=require('node:assert/strict');
          const files=fs.readdirSync('.baseline-contracts').filter(f=>f.endsWith('.json'));
          for(const f of files){
            const a=JSON.parse(fs.readFileSync('.baseline-contracts/'+f));
            const b=JSON.parse(fs.readFileSync('build/contracts/'+f));
            for(const key of ['abi','bytecode','deployedBytecode']) assert.deepEqual(a[key],b[key],f+': '+key);
          }
          fs.writeFileSync('bytecode-comparison.json',JSON.stringify({baseline:'fd8f6310454fc518f67c3168117f437acd9a4f6a',identicalArtifacts:files.length},null,2));
          console.log('BYTECODE_IDENTICAL',files.length);
          NODE
      - name: Run unchanged contract tests and existing toolchain fixtures
        run: |
          npm test > test.log 2>&1 || { tail -120 test.log; exit 1; }
          node -e 'const s=require("fs").readFileSync("test.log","utf8"); if(!/94 passing/.test(s)||!/6 pending/.test(s)) throw new Error("Unexpected test count"); console.log("94 passing; six existing skips");'
          timeout 120s npm run test:toolchain > toolchain.log 2>&1 || { tail -100 toolchain.log; exit 1; }
      - name: Test all patched API consumers and security regressions
        run: timeout 120s npm run test:security-compat > security-compat.log 2>&1 || { cat security-compat.log; exit 1; }
      - name: Save only fully validated candidate source files
        run: |
          git diff --exit-code -- contracts migrations test truffle-config.js
          mkdir -p validated/tools/compat
          cp package.json package-lock.json validated/
          rsync -a --exclude=node_modules/ tools/compat/ validated/tools/compat/
          if find validated -type l | grep -q .; then echo 'Unexpected symlink in candidate'; exit 1; fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: validated-security-tail
          path: validated/
          retention-days: 3
          if-no-files-found: error
      - name: Save audit and test evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: security-tail-evidence
          path: |
            audit-before.json
            audit-after.json
            security-tail-summary.json
            bytecode-comparison.json
            request-upstream-metadata.json
            package.json
            package-lock.json
            baseline-install.log
            baseline-compile.log
            resolution.log
            install.log
            compile.log
            test.log
            toolchain.log
            security-compat.log
          retention-days: 14
  persist:
    needs: candidate
    if: github.actor == 'viaweb3' && github.ref == 'refs/heads/chore/security-tail-20260922'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: chore/security-tail-20260922
      - name: Reject concurrent branch changes
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
        env:
          EXPECTED_SHA: ${{ github.sha }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: validated-security-tail
          path: .
      - name: Commit only the tested candidate
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- package.json package-lock.json tools/compat
          git diff --cached --stat
          git commit -m 'fix: replace vulnerable legacy utility implementations with tested patched releases'
          git push origin HEAD:chore/security-tail-20260922
